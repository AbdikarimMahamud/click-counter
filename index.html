<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click-Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <div class="counter">
        <img src="./png-clipart-hello-kitty-logo-graphics-hello-kitty-text-logo-thumbnail-removebg-preview.png" width="100px" alt="">
        <div class="input">
        <input id="result-box" type="number" required>
        </div>
        <div class="counter-buttons">
        <button class="add button">+1</button>
        <button class="reset button">Reset</button>
        <button class="subtract button">-1</button>
       </div>
      </div>
    <script src="script.js"></script>
  </body>
</html>
